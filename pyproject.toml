[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "mmregcheck"
version = "0.1.0"
description = "MM-RegCheck: Training-Free Causal-Aware Multimodal Reasoning for Regulatory Evasion Detection (ACM MM 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tam Nguyen" },
    { name = "Hoang-An Vo" },
    { name = "Truong Phu Le" },
    { name = "Khoa Anh Ta" },
    { name = "Khanh Quoc Tran", email = "khanhtq@nus.edu.vn" },
    { name = "Duyen Thi My Ngo" },
    { name = "Bao-Thi Trong Dang" },
    { name = "Le Hoang Uyen Thu" },
    { name = "Lizi Liao" },
    { name = "Binh Thanh Nguyen" },
]
keywords = [
    "multimodal-reasoning",
    "causal-inference",
    "regulatory-compliance",
    "vision-language-models",
    "fact-checking",
    "acm-multimedia",
]
dependencies = [
    "pydantic>=2.7.0",
    "rich>=13.7.1",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.8",
]

[project.scripts]
mmregcheck = "mmregcheck.cli:app"

[project.urls]
Homepage = "https://khanhtq29vn.github.io/MM-RegCheck/"
Repository = "https://github.com/khanhtq29vn/MM-RegCheck"
Paper = "https://doi.org/10.1145/3767308.3836494"
Issues = "https://github.com/khanhtq29vn/MM-RegCheck/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mmregcheck"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mmregcheck"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
mypy_path = "src"
packages = ["mmregcheck"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
